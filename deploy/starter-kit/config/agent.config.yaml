# - Device Configuration -
devices: devices

# - Modules -
modules:

# ============================================================================
#  HTTP server — exposes the MTConnect REST endpoint (/probe, /current, /sample)
#  Enabled by default so /probe works on first boot; comment out to disable.
# ============================================================================

- http-server:
    port: 5000
    indentOutput: true
    documentFormat: xml
    accept:
      text/xml: xml
      application/json: json
    responseCompression:
    - gzip
    - br
    files:
    - path: schemas
      location: schemas
    - path: styles
      location: styles
    - path: styles/favicon.ico
      location: favicon.ico

# ============================================================================
#  MQTT relay — forwards observations to an external MQTT broker
#  Uncomment + edit broker details for this site.
# ============================================================================

# - mqtt-relay: # Entity structure — one message per observation
#     server: host.docker.internal
#     port: 1883                    # use the broker's TLS port (e.g. 8883) when tls is set below
#     durableRelay: true
#     currentInterval: 5000
#     sampleInterval: 500
#     documentFormat: JSON
#     topicPrefix: MTConnect/Entity
#     topicStructure: Entity
#     # --- Broker username/password (optional; plaintext on the wire unless tls is enabled) ---
#     # username: mtconnect
#     # password: hunter2
#     # --- TLS (optional; MQTT uses a NESTED tls: pem: block — different keys than the SPB relay) ---
#     # tls:
#     #   pem:
#     #     certificateAuthority: certs/broker-ca.crt   # pin the broker CA (server-auth TLS)
#     #     certificatePath: certs/agent.crt            # client cert (add cert + key
#     #     privateKeyPath:  certs/agent.key            # only for mutual TLS)
#     #     privateKeyPassword: changeit                # omit if the key isn't encrypted
#     # (drop cert files in config/certs/ and uncomment the certs volume in docker-compose.yml)

# ============================================================================
#  Sparkplug B relay — forwards observations as SPB DBIRTH/DDATA/DDEATH
#  Uncomment + edit broker + Sparkplug Group / Node identity for this site.
# ============================================================================

# - sparkplug-relay:
#     server: host.docker.internal
#     port: 1883
#     groupId: Factory              # top-level Sparkplug Group namespace
#     nodeId: Agent1                # Edge Node ID (this agent's identity)
#     # --- Broker username/password (optional; plaintext on the wire unless useTls) ---
#     # username: mtconnect
#     # password: hunter2
#     # --- TLS (see agent/Modules/MTConnect.NET-AgentModule-SparkplugBRelay/ReadMe.md) ---
#     # useTls: true                          # pair with the broker's TLS port (8883)
#     # caCertificateFile: certs/broker-ca.crt   # pin the broker CA (PEM or DER)
#     # clientCertificateFile: certs/agent1.pfx  # mutual-TLS client certificate (PKCS#12)
#     # clientCertificatePassword: changeit
#     # (drop cert files in config/certs/ and uncomment the certs volume in docker-compose.yml)

# ============================================================================
#  OPC UA adapter — one block per machine
#  See profiles/ folder for NodeId mapping files (.yaml + optional .template.xml).
# ============================================================================

# - opcua-adapter: # example: Sinumerik 840D, anonymous, unencrypted
#     deviceKey: Sinu-001
#     endpoint: opc.tcp://192.168.1.50:4840
#     securityPolicy: None          # "None" (trusted/segmented networks only) or "Basic256Sha256" (encrypted)
#     identity:
#       mode: anonymous             # or "username" below; x509 client identity is not supported in v1
#       # username: mtconnect       # required when mode: username
#       # password: hunter2         # UTF-8 plaintext (encrypted on the wire only with Basic256Sha256)
#     samplingInterval: 250
#     publishingInterval: 1000
#     # ignoreTimestamps: true      # per-adapter override: re-stamp THIS controller with the agent
#     #                             # clock (drops its OPC UA source timestamps). Omit = inherit the
#     #                             # agent-wide setting below; false = keep source time regardless.
#     profile: sinumerik_840d       # references profiles/sinumerik_840d.yaml
#     # Basic256Sha256: the module self-generates a client cert under /app/pki/own on first run —
#     # move it from the server's rejected/ store to trusted/ once. Mount ./pki:/app/pki (see
#     # docker-compose.yml) so it persists across restarts and you only trust it a single time.

# ============================================================================
#  SHDR adapter — TCP socket connection to a TrakHound SHDR adapter on the HMI
#  One block per machine. deviceKey must match devices/<key>.xml
# ============================================================================

# - shdr-adapter: # example: machine with an SHDR adapter at 192.168.1.100
#     deviceKey: Machine-01
#     hostname: 192.168.1.100
#     port: 7878
#     heartbeat: 5000
#     reconnectInterval: 600
#     connectionTimeout: 1000
#     # ignoreTimestamps: true       # per-adapter override (SHDR) - stamp with the agent clock

# ============================================================================
#  Haas Ethernet adapter — polls a Haas CNC over TCP (usually via Moxa NPort)
#  Built-in: serial number, software/model, mode, uptime/cutting time, cycle
#  times, M30 counters, program state, X/Y/Z work + machine positions,
#  single-block, last M-code. Add extra Q-codes / macros via YAML.
# ============================================================================

# - haas-ethernet: # example: Haas VF-2 behind a Moxa NPort at .254
#     deviceKey: HAAS-VF2           # must match devices/HAAS-VF2.xml
#     server: 192.168.127.254        # Moxa NPort IP (or direct-Ethernet Haas)
#     port: 4001                    # Moxa NPort port 1 = 4001, port 2 = 4002, ...
#     pollInterval: 1.0
#     # commands:                   # extra Q-codes beyond the 11 built-in
#     #   - { name: air_pressure, command: "?Q999" }
#     # macroVariables:              # extra macros beyond the 8 built-in
#     #   - { name: feedrate, variable: 3003 }

# ============================================================================
#  Agent buffer + global settings
# ============================================================================

observationBufferSize: 150000
assetBufferSize: 1000

# Overwrite EVERY incoming observation's timestamp with the agent's own clock. Agent-wide:
# applies to all adapters (SHDR, OPC UA, Haas, ...). Most useful for OPC UA, which otherwise
# passes the controller's SOURCE timestamps through - turn on if a controller's clock can't be
# NTP-disciplined. Haas already stamps with the agent clock (no-op). Per-adapter overrides
# above: OPC UA is three-way (unset=inherit, true=force on, false=force off); SHDR can force on.
# ignoreTimestamps: true

# durable: true
# durableBufferPath: /app/buffer

# defaultVersion: 2.7
