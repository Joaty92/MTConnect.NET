# - Device Configuration -
devices: devices

# - Modules -
modules:

# ============================================================================
#  HTTP server — exposes the MTConnect REST endpoint (/probe, /current, /sample)
#  Enabled by default so /probe works on first boot; comment out to disable.
# ============================================================================

- http-server:
    port: 5000
    indentOutput: true
    documentFormat: xml
    accept:
      text/xml: xml
      application/json: json
    responseCompression:
    - gzip
    - br
    files:
    - path: schemas
      location: schemas
    - path: styles
      location: styles
    - path: styles/favicon.ico
      location: favicon.ico

# ============================================================================
#  MQTT relay — forwards observations to an external MQTT broker
#  Uncomment + edit broker details for this site.
# ============================================================================

# - mqtt-relay: # Entity structure — one message per observation
#     server: host.docker.internal
#     port: 1883                    # use the broker's TLS port (e.g. 8883) when tls is set below
#     durableRelay: true
#     currentInterval: 5000
#     sampleInterval: 500
#     documentFormat: JSON
#     topicPrefix: MTConnect/Entity
#     topicStructure: Entity
#     # --- Broker username/password (optional; plaintext on the wire unless tls is enabled) ---
#     # username: mtconnect
#     # password: hunter2
#     # --- TLS (optional). Any tls: block turns TLS on; useTls: true alone also works
#     #     (broker validated against the OS trust store). Credentials and certificates
#     #     are independent and may be combined. NOTE the shape differs from the SPB
#     #     relay above: MQTT nests under tls: pem: and wants a separate .crt + .key. ---
#     # tls:
#     #   pem:
#     #     certificateAuthority: certs/broker-ca.crt   # pin the broker CA (server-auth TLS)
#     #     certificatePath: certs/agent.crt            # client cert (add cert + key
#     #     privateKeyPath:  certs/agent.key            # only for mutual TLS)
#     #     privateKeyPassword: changeit                # omit if the key isn't encrypted
#     # (drop cert files in config/certs/ and uncomment the certs volume in docker-compose.yml)

# ============================================================================
#  Sparkplug B relay — forwards observations as SPB DBIRTH/DDATA/DDEATH
#  Uncomment + edit broker + Sparkplug Group / Node identity for this site.
# ============================================================================

# - sparkplug-relay:
#     server: host.docker.internal
#     port: 1883
#     groupId: Factory              # top-level Sparkplug Group namespace
#     nodeId: Agent1                # Edge Node ID (this agent's identity)
#     # --- Broker username/password (optional; plaintext on the wire unless useTls) ---
#     # username: mtconnect
#     # password: hunter2
#     # --- TLS (see agent/Modules/MTConnect.NET-AgentModule-SparkplugBRelay/ReadMe.md) ---
#     # useTls: true                          # pair with the broker's TLS port (8883)
#     # caCertificateFile: certs/broker-ca.crt   # pin the broker CA (PEM or DER)
#     # clientCertificateFile: certs/agent1.pfx  # mutual-TLS client certificate (PKCS#12)
#     # clientCertificatePassword: changeit
#     # (drop cert files in config/certs/ and uncomment the certs volume in docker-compose.yml)

# ============================================================================
#  OPC UA adapter — one block per machine
#  See profiles/ folder for NodeId mapping files (.yaml + optional .template.xml).
# ============================================================================

# - opcua-adapter: # example: Sinumerik 840D, anonymous, unencrypted
#     deviceKey: Sinu-001
#     endpoint: opc.tcp://192.168.1.50:4840
#     securityPolicy: None          # "None" (trusted/segmented networks only) or "Basic256Sha256" (encrypted)
#     # acceptUntrustedServerCertificate: false  # default true = channel encrypted but server NOT
#     #                             # authenticated; false requires the server cert in pki/trusted
#     identity:
#       mode: anonymous             # or "username" below; x509 client identity is not supported in v1
#       # username: mtconnect       # required when mode: username
#       # password: hunter2         # UTF-8 plaintext (encrypted on the wire only with Basic256Sha256)
#     samplingInterval: 250
#     publishingInterval: 1000
#     # ignoreTimestamps: true      # per-adapter override: re-stamp THIS controller with the agent
#     #                             # clock (drops its OPC UA source timestamps). Omit = inherit the
#     #                             # agent-wide setting below; false = keep source time regardless.
#     profile: sinumerik_840d       # references profiles/sinumerik_840d.yaml
#     # Basic256Sha256: the module self-generates a client cert under /app/pki/own on first run —
#     # move it from the server's rejected/ store to trusted/ once. Mount ./pki:/app/pki (see
#     # docker-compose.yml) so it persists across restarts and you only trust it a single time.

# ============================================================================
#  SHDR adapter — TCP socket connection to a TrakHound SHDR adapter on the HMI
#  One block per machine. deviceKey must match devices/<key>.xml
# ============================================================================

# - shdr-adapter: # example: machine with an SHDR adapter at 192.168.1.100
#     deviceKey: Machine-01
#     hostname: 192.168.1.100
#     port: 7878
#     heartbeat: 5000
#     reconnectInterval: 600
#     connectionTimeout: 1000
#     # ignoreTimestamps: true       # per-adapter override (SHDR) - stamp with the agent clock

# ============================================================================
#  Haas Ethernet adapter — polls a Haas CNC over TCP (usually via Moxa NPort)
#  Built-in: serial number, software/model, mode, uptime/cutting time, cycle
#  times, M30 counters, program state, X/Y/Z work + machine positions,
#  single-block, last M-code. Add extra Q-codes / macros via YAML.
# ============================================================================

# - haas-ethernet: # example: Haas VF-2 behind a Moxa NPort at .254
#     deviceKey: HAAS-VF2           # must match devices/HAAS-VF2.xml
#     server: 192.168.127.254        # Moxa NPort IP (or direct-Ethernet Haas)
#     port: 4001                    # Moxa NPort port 1 = 4001, port 2 = 4002, ...
#     pollInterval: 1.0
#     # commands:                   # extra Q-codes beyond the 11 built-in
#     #   - { name: air_pressure, command: "?Q999" }
#     # macroVariables:              # extra macros beyond the 8 built-in
#     #   - { name: feedrate, variable: 3003 }

# ============================================================================
#  Agent buffer + global settings
#  Everything below is TOP-LEVEL - a sibling of devices: and modules:, NOT
#  nested inside a module block. Commented lines show the built-in default.
# ============================================================================

observationBufferSize: 150000
assetBufferSize: 1000

# Overwrite EVERY incoming observation's timestamp with the agent's own clock. Agent-wide:
# applies to all adapters (SHDR, OPC UA, Haas, ...). Most useful for OPC UA, which otherwise
# passes the controller's SOURCE timestamps through - turn on if a controller's clock can't be
# NTP-disciplined. Haas already stamps with the agent clock (no-op). Per-adapter overrides
# above: OPC UA is three-way (unset=inherit, true=force on, false=force off); SHDR can force on.
# ignoreTimestamps: true

# durable: true
# durableBufferPath: /app/buffer

# Compress the durable buffer files on disk. Smaller footprint, more CPU per write.
# Only has any effect when durable: true.
# useBufferCompression: false

# defaultVersion: 2.7

# ---------------------------------------------------------------------------
#  Validation
# ---------------------------------------------------------------------------

# How strictly incoming Observations and Assets are checked against their DataItem
# definition (type, controlled vocabulary, units):
#   0 = Ignore   no validation - lowest CPU, invalid values stored as-is
#   1 = Warning  validate, log the problem, store anyway  [DEFAULT]
#   2 = Remove   drop the invalid value
#   3 = Strict   reject the observation entirely
# Worth dropping to 0 on a busy agent once the device XMLs are known good: validation
# runs on every observation, and on an adapter pushing hundreds of values a second it
# is a measurable share of CPU. Keep it at 1 while a new device model is bedding in -
# it is what tells you a key does not match its declared type.
# inputValidationLevel: 1

# Stamp each Observation with a Quality (VALID / INVALID / UNVERIFIABLE) plus the
# Deprecated and Extended flags, using the validation result. Independent of the level
# above. Off by default; turn on if a consumer needs to distinguish trustworthy values.
# enableValidation: false

# ---------------------------------------------------------------------------
#  Value handling
# ---------------------------------------------------------------------------

# Convert incoming values from the DataItem's nativeUnits to its units (e.g. a
# controller reporting MILLIMETER/MINUTE into MILLIMETER/SECOND). Defaults on. Turn off
# only if an adapter already sends values in the declared units and the conversion is
# corrupting them - a wrong nativeUnits is the usual cause, and fixing the device XML
# is the better fix.
# convertUnits: true

# Uppercase Observation values before validating them, so an adapter sending "active"
# satisfies a vocabulary expecting "ACTIVE". Leave off unless an adapter's casing cannot
# be corrected at source - it masks a real mismatch.
# ignoreObservationCase: false

# ---------------------------------------------------------------------------
#  Agent identity + self-reporting
# ---------------------------------------------------------------------------

# Publish the built-in "Agent" Device - a synthetic device describing the agent itself.
# It appears in /probe alongside the machines with a GUID-style uuid, and (because the
# relays publish everything in the buffer) shows up on MQTT / Sparkplug too. It carries
# per-adapter CONNECTION_STATUS, observation and asset counts, and agent availability.
# Set false to remove it everywhere - but note that adapter connection status is how you
# notice a machine has quietly stopped feeding, so prefer filtering it at the subscriber
# or broker if the objection is only topic clutter.
# enableAgentDevice: true

# Collect ObservationUpdateRate / AssetUpdateRate metrics, surfaced on the Agent Device.
# No use if enableAgentDevice is false.
# enableMetrics: true

# Pin the agent's uuid. Per the MTConnect v2.7 XSD this identifies the agent for its
# entire life, and Header.instanceId is the per-boot discriminator. Leave unset to have
# one derived deterministically - it stays stable across restarts either way.
# agentUuid: agent-001

# IANA timezone applied to timestamps in output documents (e.g. Europe/London).
# Unset = UTC, which is what most consumers expect. Set only if a consumer needs local time.
# timezoneOutput: UTC

# ---------------------------------------------------------------------------
#  Configuration file monitoring
# ---------------------------------------------------------------------------

# Watch this file and the device files, restarting the agent when one changes.
# Defaults on - but be aware filesystem events do NOT reliably cross a Windows-host to
# Linux-container bind mount, so on Docker Desktop a change usually goes unnoticed and
# you should assume `docker compose restart` is required. A NEW device file is never
# picked up on any platform: watchers are created only for the files present at startup.
# monitorConfigurationFiles: true

# Minimum seconds between restarts triggered by the watcher above. Guards against a
# rapid edit or an editor's write-then-truncate causing a restart loop.
# configurationFileRestartInterval: 2

# ---------------------------------------------------------------------------
#  Processors
# ---------------------------------------------------------------------------

# Observation/Asset processing pipeline. Every observation is passed through the chain
# before it is stored, so leave this out entirely unless you are using it - the hot path
# does work per observation even when the directory holds no scripts.
# processors:
# - python:
#     directory: processors

# Windows-service settings (serviceName, serviceDisplayName, serviceAutoStart) also exist
# but do nothing in a container - they apply when the agent is installed as a service.
