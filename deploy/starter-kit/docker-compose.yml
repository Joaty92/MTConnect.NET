# Starter-kit deployment compose file.
# Zip the parent starter-kit/ folder and ship alongside the .tar to a new site.
# On the target: unzip, `docker load -i ../mtconnect-agent-spb-<ver>.tar`,
# edit config/agent.config.yaml, `docker compose up -d`.

services:

  mtconnect-agent-spb:

    # Bump this tag to match whatever .tar you shipped alongside.
    # `docker load` prints "Loaded image: <tag>" so you know what to reference.
    image: mtconnect-agent-spb:1.1.0

    container_name: mtconnect-agent-spb

    restart: unless-stopped

    ports:
      # Host port : container port. Change the LEFT number if 5003 conflicts
      # with something already listening on this target.
      - "5003:5000"

    volumes:
      - ./config/agent.config.yaml:/app/agent.config.yaml
      - ./config/NLog.config:/app/NLog.config
      - ./devices:/app/devices
      - ./profiles:/app/profiles
      - ./logs:/app/logs
      # Sparkplug bdSeq counter. Without this mount the state lives inside the container
      # and is lost on recreation, so every deployment restarts the sequence at zero and
      # replays values a Host Application has already seen. No config change needed — one
      # directory serves every sparkplug-relay block.
      - ./state:/app/state
      # Uncomment when using TLS certs for the mqtt-relay OR sparkplug-relay
      # (config references them as certs/<file>; put the files in config/certs/):
      # - ./config/certs:/app/certs
      # Uncomment for OPC UA securityPolicy: Basic256Sha256 — persists the self-signed client
      # cert (pki/own) so the server only trusts it once, not after every container restart:
      # - ./pki:/app/pki

# Every device this agent loads is published under ONE Sparkplug Edge Node, so a
# rebirth, an NDEATH, or a config-file restart applies to all of them at once. To
# split a larger fleet across several Edge Nodes, add one service per node with its
# own config/ and devices/ folder — worked example and the reasoning are in
# ../docker-compose.deploy.template.yml and deploy/README.md.
